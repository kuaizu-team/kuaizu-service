name: Deploy to Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production after verification
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: kuaizu-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.image_version }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download verified image and evidence
        uses: actions/download-artifact@v4
        with:
          name: verified-backend
          path: verified-release

      - name: Validate admin secrets
        env:
          ADMIN_CREDENTIAL_KEY: ${{ secrets.ADMIN_CREDENTIAL_KEY }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ENV_DOCKER: ${{ secrets.ENV_DOCKER }}
        run: |
          for name in ENV_DOCKER ADMIN_CREDENTIAL_KEY ADMIN_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} secret is not configured."
              exit 1
            fi
          done
          umask 077
          printf '%s\n' "$ENV_DOCKER" > .env.docker
          printf 'ADMIN_CREDENTIAL_KEY=%s\nADMIN_JWT_SECRET=%s\n' \
            "$ADMIN_CREDENTIAL_KEY" "$ADMIN_JWT_SECRET" >> .env.docker

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify downloaded release
        working-directory: verified-release
        env:
          EXPECTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
        run: |
          sha256sum -c kuaizu-server.tar.gz.sha256
          test "$(jq -r .commit release-metadata.json)" = "$GITHUB_SHA"
          test "$(jq -r .version release-metadata.json)" = "$VERSION"
          test "$(jq -r .image_id release-metadata.json)" = "$EXPECTED_IMAGE_ID"

      - name: Preserve current deployment
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -eu
            umask 077
            mkdir -p ~/kuaizu-server
            cd ~/kuaizu-server
            backup="backups/${{ github.run_id }}-${{ github.run_attempt }}"
            mkdir -p "$backup"
            for file in docker-compose.yml .env.docker; do
              if [ -f "$file" ]; then cp -p "$file" "$backup/"; fi
            done
            for name in kuaizu-api kuaizu-console; do
              if docker inspect "$name" >/dev/null 2>&1; then
                docker inspect -f '{{.Name}} image_id={{.Image}} image_ref={{.Config.Image}}' "$name" >> "$backup/previous-images.txt"
                old_image="$(docker inspect -f '{{.Image}}' "$name")"
                docker tag "$old_image" "kuaizu-server:rollback-${{ github.run_id }}-${{ github.run_attempt }}-$name"
              fi
            done
          EOF

      - name: Transfer image and compose file to server
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p ~/kuaizu-server"
          scp -P "$SSH_PORT" verified-release/kuaizu-server.tar.gz verified-release/kuaizu-server.tar.gz.sha256 verified-release/binaries.sha256 verified-release/release-metadata.json "$SSH_USER@$SSH_HOST:~/kuaizu-server/"
          scp -P "$SSH_PORT" docker-compose.yml "$SSH_USER@$SSH_HOST:~/kuaizu-server/"

      - name: Create .env.docker on server
        run: |
          scp -P "$SSH_PORT" .env.docker "$SSH_USER@$SSH_HOST:~/kuaizu-server/"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd ~/kuaizu-server
            chmod 600 .env.docker
          EOF

      - name: Load image, restart services, and healthcheck
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -euo pipefail
            cd ~/kuaizu-server

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                docker-compose "$@"
              fi
            }

            fail_with_logs() {
              echo "::error::$1"
              echo "===== docker ps ====="
              docker ps -a --filter "name=^/kuaizu-api$" --filter "name=^/kuaizu-console$"
              echo "===== kuaizu-console logs ====="
              docker logs --tail 200 kuaizu-console 2>&1 || true
              exit 1
            }

            ensure_compose_owned_or_absent() {
              name="$1"
              existing="$(docker ps -aq --filter "name=^/${name}$")"
              if [ -n "$existing" ]; then
                project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$existing" 2>/dev/null || true)"
                if [ -z "$project" ]; then
                  fail_with_logs "Container ${name} exists but is not managed by Docker Compose. Stop/remove the old manual container, then rerun deploy."
                fi
              fi
            }

            wait_http() {
              name="$1"
              url="$2"
              expected="$3"
              method="${4:-GET}"
              data="${5:-}"

              for i in $(seq 1 30); do
                if [ "$method" = "POST" ]; then
                  code="$(curl -sS -o /tmp/kuaizu-health.out -w "%{http_code}" -X POST "$url" -H "Content-Type: application/json" -d "$data" || true)"
                else
                  code="$(curl -sS -o /tmp/kuaizu-health.out -w "%{http_code}" "$url" || true)"
                fi

                if [ "$code" = "$expected" ]; then
                  echo "${name} healthcheck passed with HTTP ${code}"
                  return 0
                fi

                if printf '%s' "$code" | grep -Eq '^5'; then
                  cat /tmp/kuaizu-health.out || true
                  fail_with_logs "${name} returned HTTP ${code}"
                fi

                sleep 2
              done

              cat /tmp/kuaizu-health.out || true
              fail_with_logs "${name} healthcheck timed out; last HTTP code: ${code:-none}"
            }

            sha256sum -c kuaizu-server.tar.gz.sha256
            gunzip -c kuaizu-server.tar.gz | docker load
            export VERSION=${{ env.VERSION }}
            test "$(docker image inspect -f '{{.Id}}' "kuaizu-server:$VERSION")" = '${{ needs.verify.outputs.image_id }}'

            ensure_compose_owned_or_absent kuaizu-api
            ensure_compose_owned_or_absent kuaizu-console

            compose down --remove-orphans
            compose up -d --no-build --remove-orphans kuaizu-api kuaizu-console
            compose ps

            wait_http "kuaizu-api" "http://127.0.0.1:8080/health" "200"
            wait_http "kuaizu-console" "http://127.0.0.1:8081/admin/auth/login" "401" "POST" '{"username":"__healthcheck__","password":"__healthcheck__"}'

            umask 077
            mkdir -p .release-runtime
            docker cp kuaizu-api:/app/kuaizu-server .release-runtime/kuaizu-server
            docker cp kuaizu-console:/app/kuaizu-admin .release-runtime/kuaizu-admin
            (cd .release-runtime && sha256sum -c ../binaries.sha256)
            for name in kuaizu-api kuaizu-console; do
              test "$(docker inspect -f '{{.Image}}' "$name")" = '${{ needs.verify.outputs.image_id }}'
            done
            cp release-metadata.json .release-runtime/

            rm kuaizu-server.tar.gz

            # Compose defaults to latest; advance it only after every release check passes.
            docker tag '${{ needs.verify.outputs.image_id }}' kuaizu-server:latest
          EOF

      # Keep the previous tagged images and restricted backups for recovery.
