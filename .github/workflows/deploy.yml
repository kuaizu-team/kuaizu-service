name: Deploy to Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate admin secrets
        env:
          ADMIN_CREDENTIAL_KEY: ${{ secrets.ADMIN_CREDENTIAL_KEY }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          for name in ADMIN_CREDENTIAL_KEY ADMIN_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} secret is not configured."
              exit 1
            fi
          done

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Set image version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          export COMMIT=${{ github.sha }}
          docker build \
            --build-arg VERSION=$VERSION \
            --build-arg COMMIT=$COMMIT \
            -t kuaizu-server:$VERSION .
          docker tag kuaizu-server:$VERSION kuaizu-server:latest

      - name: Save Docker image to tarball
        run: |
          docker save kuaizu-server:$VERSION | gzip > kuaizu-server.tar.gz

      - name: Transfer image and compose file to server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/kuaizu-server"
          scp -P ${{ secrets.SSH_PORT || 22 }} kuaizu-server.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/kuaizu-server/
          scp -P ${{ secrets.SSH_PORT || 22 }} docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/kuaizu-server/

      - name: Create .env.docker on server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ~/kuaizu-server
            cat > .env.docker << 'ENVEOF'
          ${{ secrets.ENV_DOCKER }}
          ADMIN_CREDENTIAL_KEY=${{ secrets.ADMIN_CREDENTIAL_KEY }}
          ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
          ENVEOF
          EOF

      - name: Load image, restart services, and healthcheck
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ~/kuaizu-server

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                docker-compose "$@"
              fi
            }

            fail_with_logs() {
              echo "::error::$1"
              echo "===== docker ps ====="
              docker ps -a --filter "name=^/kuaizu-api$" --filter "name=^/kuaizu-console$"
              echo "===== kuaizu-console logs ====="
              docker logs --tail 200 kuaizu-console 2>&1 || true
              exit 1
            }

            ensure_compose_owned_or_absent() {
              name="$1"
              existing="$(docker ps -aq --filter "name=^/${name}$")"
              if [ -n "$existing" ]; then
                project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$existing" 2>/dev/null || true)"
                if [ -z "$project" ]; then
                  fail_with_logs "Container ${name} exists but is not managed by Docker Compose. Stop/remove the old manual container, then rerun deploy."
                fi
              fi
            }

            wait_http() {
              name="$1"
              url="$2"
              expected="$3"
              method="${4:-GET}"
              data="${5:-}"

              for i in $(seq 1 30); do
                if [ "$method" = "POST" ]; then
                  code="$(curl -sS -o /tmp/kuaizu-health.out -w "%{http_code}" -X POST "$url" -H "Content-Type: application/json" -d "$data" || true)"
                else
                  code="$(curl -sS -o /tmp/kuaizu-health.out -w "%{http_code}" "$url" || true)"
                fi

                if [ "$code" = "$expected" ]; then
                  echo "${name} healthcheck passed with HTTP ${code}"
                  return 0
                fi

                if printf '%s' "$code" | grep -Eq '^5'; then
                  cat /tmp/kuaizu-health.out || true
                  fail_with_logs "${name} returned HTTP ${code}"
                fi

                sleep 2
              done

              cat /tmp/kuaizu-health.out || true
              fail_with_logs "${name} healthcheck timed out; last HTTP code: ${code:-none}"
            }

            gunzip -c kuaizu-server.tar.gz | docker load
            export VERSION=${{ env.VERSION }}

            ensure_compose_owned_or_absent kuaizu-api
            ensure_compose_owned_or_absent kuaizu-console

            compose down --remove-orphans
            compose up -d --no-build --remove-orphans kuaizu-api kuaizu-console
            compose ps

            wait_http "kuaizu-api" "http://127.0.0.1:8080/health" "200"
            wait_http "kuaizu-console" "http://127.0.0.1:8081/admin/auth/login" "401" "POST" '{"username":"__healthcheck__","password":"__healthcheck__"}'

            rm kuaizu-server.tar.gz
          EOF

      - name: Cleanup old images
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            docker image prune -f
          EOF
