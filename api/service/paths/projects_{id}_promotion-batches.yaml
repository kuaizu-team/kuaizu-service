parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Project ID
get:
  tags:
    - Projects
  summary: List project promotion batches
  description: Only the project creator can view recent email promotion batches.
  operationId: listProjectPromotionBatches
  parameters:
    - $ref: ../components/parameters/PageParam.yaml
    - $ref: ../components/parameters/SizeParam.yaml
    - name: days
      in: query
      description: Compatibility lookback days, capped at 30. Optional.
      schema:
        type: integer
        maximum: 30
    - name: limit
      in: query
      description: Compatibility max rows to return, capped at 50. Optional.
      schema:
        type: integer
        maximum: 50
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/ProjectPromotionBatchListResponse.yaml
