parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: 项目 ID
post:
  tags: [Projects]
  summary: 对项目内其他成员评分
  description: 所有当前项目成员均可评分；同一成员关系内，对同一目标采用滚动 30 天冷却。
  operationId: rateProjectMember
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RateProjectMemberDTO.yaml
  responses:
    '200':
      description: 评分成功并返回新的当前加权平均分
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
    '400':
      description: 参数错误或仍在冷却期
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
    '403':
      description: 评分人或目标不是当前项目成员
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
