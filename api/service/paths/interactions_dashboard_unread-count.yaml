get:
  parameters:
    - name: scope
      in: query
      schema: { type: string, enum: [entry] }
      description: Use the independent entry cursor. Omit to retain legacy detail unread totals.
  summary: Get all owned dashboard interaction unread counts
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/DashboardUnreadTotalsVO.yaml
