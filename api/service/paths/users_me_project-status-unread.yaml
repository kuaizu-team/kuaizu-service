get:
  tags:
    - Users
  summary: 获取我的项目状态未读标记
  operationId: getMyProjectStatusUnread
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      hasUnread:
                        type: boolean
    '401':
      description: 未登录
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
