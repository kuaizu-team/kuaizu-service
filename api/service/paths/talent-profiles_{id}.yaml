parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: 人才档案ID
get:
  tags:
    - TalentProfiles
  summary: 查看人才详情
  description: 返回人才名片详情，并记录一次浏览。
  operationId: getTalentProfile
  parameters:
    - name: userId
      in: query
      required: false
      schema:
        type: integer
      description: 可选用户ID，当人才档案不存在时回退查找用户基本信息
    - name: source
      in: query
      description: 'View source: 0 unknown, 1 talent list page, 2 share card.'
      schema:
        type: integer
        minimum: 0
        maximum: 2
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/TalentProfileDetailVO.yaml
