parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Talent profile ID
get:
  tags:
    - TalentProfiles
  summary: Get talent viewers
  description: Only the talent profile owner can view authenticated viewers from the last 24 hours.
  operationId: getTalentViewers
  parameters:
    - $ref: ../components/parameters/PageParam.yaml
    - name: limit
      in: query
      description: Max rows to return, capped at 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id:
                              type: integer
                            nickname:
                              type: string
                              nullable: true
                            avatar_url:
                              type: string
                              nullable: true
                            last_viewed_at:
                              type: string
                              format: date-time
