post:
  tags:
    - Auth
  summary: WeChat login precheck
  description: |
    Checks whether the WeChat openid already has a user record before the user taps the login button.
    Registered users only receive state flags; this endpoint does not issue JWT tokens or update login activity.
    Users that are missing phone binding receive a temporary registerToken for phone authorization.
    The WeChat login code is consumed for this precheck only; clients must call wx.login again before loginWithWechat.
  operationId: precheckWechatAuth
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - code
          properties:
            code:
              type: string
              description: WeChat temporary login code used only for this precheck request.
              example: 0a1b2c3d4e5f
  responses:
    '200':
      description: Precheck result
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/WechatPrecheckResponse.yaml
