  "pending": {
    "get": {
      "tags": [
        "CampusCooperations"
      ],
      "operationId": "getMyPendingStatusNotification",
      "summary": "Existing fullscreen queue; cooperation types require explicit capability",
      "security": [
        {
          "bearerAuth": []
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "code": {
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "data": {
                    "allOf": [
                      {
                        "$ref": "../../common/campus_cooperation.yaml#/schemas/CooperationPendingNotification"
                      }
                    ],
                    "nullable": true,
                    "type": "object"
                  }
                },
                "required": [
                  "code",
                  "message",
                  "data"
                ]
              }
            }
          }
        },
        "400": {
          "description": "Invalid input or business state"
        },
        "401": {
          "description": "Authentication required"
        },
        "403": {
          "description": "Role/account forbidden"
        },
        "404": {
          "description": "Resource absent or outside the current school scope"
        }
      },
      "parameters": [
        {
          "name": "includeCooperation",
          "in": "query",
          "schema": {
            "type": "boolean",
            "default": false
          },
          "description": "New clients set true for cooperation message types. Default keeps legacy archive/count/fullscreen behavior."
        }
      ]
    }
  }
