get:
  tags:
    - TalentProfiles
  summary: 搜索角色标签库
  description: 返回名片标签联想结果；可按项目角色过滤，前缀匹配优先，最多返回 20 条。
  operationId: searchRoleTags
  parameters:
    - name: keyword
      in: query
      description: 标签关键词；为空时返回该角色的默认推荐。
      schema:
        type: string
        maxLength: 32
    - name: roleCode
      in: query
      description: project_role.code；为空时搜索全部角色。
      schema:
        type: string
        maxLength: 32
    - name: limit
      in: query
      description: 返回数量，默认 10，最大 20。
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../components/schemas/RoleTagVO.yaml
