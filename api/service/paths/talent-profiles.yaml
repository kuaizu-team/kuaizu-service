get:
  tags:
    - TalentProfiles
  summary: 搜索人才库
  operationId: listTalentProfiles
  parameters:
    - $ref: ../components/parameters/PageParam.yaml
    - $ref: ../components/parameters/SizeParam.yaml
    - name: majorId
      in: query
      description: 专业ID筛选
      schema:
        type: integer
    - name: keyword
      in: query
      description: 按展示昵称、学校、专业、个人标签、自我评价和项目经历进行模糊搜索
      schema:
        type: string
    - name: schoolId
      in: query
      description: 学校ID筛选
      schema:
        type: integer
    - name: sortBy
      in: query
      description: |
        排序模式。目前支持 `school_priority`：按学校/地域、同专业/专业大类/其他专业
        划分匹配层级，每层已认证优先；收藏与点赞热度可逐级提升。同层使用 randomSeed
        保持分页顺序稳定。不传则默认按最后修改时间倒序。
      schema:
        type: string
    - name: userSchoolId
      in: query
      description: 当前用户学校 ID，`sortBy=school_priority` 时用于判断本校人才及地域优先级。
      schema:
        type: integer
    - name: userMajorId
      in: query
      description: 当前用户专业 ID，`sortBy=school_priority` 时用于判断同专业及专业大类人才。
      schema:
        type: integer
    - name: randomSeed
      in: query
      description: 同一次分页浏览使用相同随机种子；下拉刷新时传入新种子可重排同层内容。
      schema:
        type: string
        maxLength: 64
  security: []
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/TalentProfilePageResponse.yaml
post:
  tags:
    - TalentProfiles
  summary: 保存/提交我的人才卡片
  description: 未指定状态时新名片默认进入审核中；显式保存为隐私状态时不会被搜索到；请求直接上架时会降级为审核中
  operationId: upsertTalentProfile
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpsertTalentProfileDTO.yaml
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/TalentProfileDetailVO.yaml
