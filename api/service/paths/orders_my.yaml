get:
  tags:
    - Orders
  summary: 我的订单列表
  operationId: listMyOrders
  parameters:
    - $ref: ../components/parameters/PageParam.yaml
    - $ref: ../components/parameters/SizeParam.yaml
    - name: status
      in: query
      description: 订单状态筛选
      schema:
        $ref: ../components/schemas/OrderStatus.yaml
    - name: afterSale
      in: query
      description: |
        After-sale aggregate filter. When true, returns orders whose status is Refunded
        or refundStatus is 1, 2, or 3.
      schema:
        type: boolean
    - name: refundStatus
      in: query
      description: |
        Refund status filter: 0=none, 1=pending, 2=success, 3=rejected, 4=withdrawn.
      schema:
        type: integer
        enum:
          - 0
          - 1
          - 2
          - 3
          - 4
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: ../components/schemas/OrderVO.yaml
                      pageInfo:
                        $ref: ../components/schemas/PageInfo.yaml
