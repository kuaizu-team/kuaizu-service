get:
  tags:
    - Users
  summary: 获取当前用户的协作指数记录
  operationId: getMyCollaborationHistory
  responses:
    '200':
      description: 获取成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../components/schemas/CollaborationHistoryItem.yaml
    '401':
      description: 未登录
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml