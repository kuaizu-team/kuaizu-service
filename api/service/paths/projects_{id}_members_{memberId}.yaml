parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: 项目ID
  - name: memberId
    in: path
    required: true
    schema:
      type: integer
    description: 成员用户ID
delete:
  tags:
    - Projects
  summary: 移除项目成员
  description: 仅项目最高权限角色可操作；移除时自动固化该成员当前项目加权评分。
  operationId: removeProjectMember
  parameters:
    - name: score
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
      deprecated: true
      description: 已废弃并忽略；评分请使用 /projects/{id}/rate
  responses:
    '200':
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
    '400':
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
    '403':
      description: 当前角色无权移除成员
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
    '404':
      description: 项目或成员不存在
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
