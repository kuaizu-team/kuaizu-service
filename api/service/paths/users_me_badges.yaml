get:
  parameters:
    - name: scope
      in: query
      schema: { type: string, enum: [entry] }
      description: Aggregate direct child entry badges, including independent dashboard entry cursors. Omit for legacy counts.
  tags:
    - Users
  summary: Get all profile and tab bar badge counts
  operationId: getMyBadges
  responses:
    '200':
      description: Badge snapshot
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/ProfileBadgeCounts.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
