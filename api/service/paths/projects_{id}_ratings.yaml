parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: 项目 ID
get:
  tags: [Projects]
  summary: 获取项目全员评分状态
  description: 返回评分、30 天冷却状态，以及评分者或被评分者加入项目不足 7 天时的冻结状态。
  operationId: listProjectMemberRatings
  responses:
    '200':
      description: 当前项目所有成员的评分、冻结状态与当前用户冷却状态
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../components/schemas/ProjectMemberRatingStatus.yaml
    '403':
      description: 当前用户不是项目成员
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
post:
  tags: [Projects]
  summary: 对项目内其他成员评分
  description: 评分者与被评分者均须加入当前项目满 7 天；同一成员关系内，对同一目标采用滚动 30 天冷却。
  operationId: rateProjectMember
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RateProjectMemberDTO.yaml
  responses:
    '200':
      description: 评分成功并返回新的当前加权平均分
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: ../components/schemas/ProjectMemberRatingResult.yaml
    '400':
      description: 参数错误、评分者或被评分者仍在 7 天冻结期，或仍在 30 天冷却期
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
    '403':
      description: 评分人或目标不是当前项目成员
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
