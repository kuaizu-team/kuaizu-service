get:
  tags:
    - TalentProfiles
  summary: 查看我的人才详情
  operationId: getMyTalentProfile
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/TalentProfileDetailVO.yaml
delete:
  tags:
    - TalentProfiles
  summary: 将我的人才名片设为未入驻状态
  description: 可用于离开人才库或撤回审核；expectedStatus 可选，旧客户端不传时保持兼容。
  operationId: deleteMyTalentProfile
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            expectedStatus:
              $ref: ../components/schemas/TalentStatus.yaml
              description: 客户端最后看到的状态；状态已变化时拒绝本次操作。
  responses:
    '200':
      description: 设置成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
