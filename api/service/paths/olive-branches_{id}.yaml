parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Olive branch ID
patch:
  tags:
    - OliveBranches
  summary: Handle olive branch invitation
  operationId: handleOliveBranch
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - action
          properties:
            action:
              type: string
              enum:
                - ACCEPT
                - DISCUSS
                - ADMIT
                - REJECT
              description: ACCEPT/DISCUSS enters discussing, ADMIT joins the team, REJECT declines
            role:
              type: string
              description: Project role to assign when action is ADMIT
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
