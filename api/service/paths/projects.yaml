get:
  tags:
    - Projects
  summary: 项目列表/搜索
  operationId: listProjects
  security: []
  parameters:
    - $ref: ../components/parameters/PageParam.yaml
    - $ref: ../components/parameters/SizeParam.yaml
    - name: keyword
      in: query
      description: 关键词搜索
      schema:
        type: string
    - name: schoolId
      in: query
      description: 学校ID筛选
      schema:
        type: integer
    - name: status
      in: query
      description: 项目状态筛选
      schema:
        $ref: ../components/schemas/ProjectStatus.yaml
    - name: direction
      in: query
      description: 项目方向筛选
      schema:
        $ref: ../components/schemas/Direction.yaml
    - name: eventId
      in: query
      description: Related event ID
      schema:
        type: integer
        minimum: 1
    - name: excludeEventId
      in: query
      description: 排除与指定赛事关联的项目，供赛事详情页“更多项目”使用。
      schema:
        type: integer
        minimum: 1
    - name: isCrossSchool
      in: query
      description: '是否跨校: 1-可以,0-不可以'
      schema:
        type: integer
    - name: sortBy
      in: query
      description: |
        排序模式。目前支持 `school_priority`：按本校 > 跨校 > 其他优先级排序，
        同优先级内按发布时间倒序。不传则默认按发布时间倒序。
      schema:
        type: string
    - name: userSchoolId
      in: query
      description: 当前用户学校 ID，`sortBy=school_priority` 时用于判断本校项目。
      schema:
        type: integer
    - name: randomSeed
      in: query
      description: 同一次分页浏览使用相同随机种子；下拉刷新时传入新种子可重排同层内容。
      schema:
        type: string
        maxLength: 64
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/ProjectPageResponse.yaml
post:
  tags:
    - Projects
  summary: 发布新项目
  description: 创建后状态默认为"待审核"
  operationId: createProject
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateProjectDTO.yaml
  responses:
    '200':
      description: 创建成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/ProjectVO.yaml
