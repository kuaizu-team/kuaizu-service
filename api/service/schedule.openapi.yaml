openapi: 3.0.3
info:
  title: Personal schedules (manual route contract)
  version: 1.0.0
  description: Registered by RegisterScheduleRoutes on the existing JWT-protected API group. All dates and times use Asia/Shanghai. This contract is separate from the generated server interface.
servers:
  - url: /api/v2
security:
  - bearerAuth: []
paths:
  /users/me/schedules:
    get:
      operationId: listSchedules
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      description: Inclusive date range, maximum 93 days apart. More than 2000 results returns 400; callers must narrow the range.
      responses:
        '200':
          description: Current user's schedules, ordered by date, all-day first, then time and ID.
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: {type: integer}
                  message: {type: string}
                  data: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
        '400': {description: Invalid range or too many items}
        '401': {description: Login required}
    post:
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleInput'}
      responses:
        '200': {$ref: '#/components/responses/Saved'}
        '400': {description: Invalid schedule}
        '401': {description: Login required}
  /users/me/schedules/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    put:
      operationId: updateSchedule
      description: Full replacement; identical content also succeeds. Another user's ID is treated as not found.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleInput'}
      responses:
        '200': {$ref: '#/components/responses/Saved'}
        '400': {description: Invalid schedule}
        '401': {description: Login required}
        '404': {description: Not found}
    delete:
      operationId: deleteSchedule
      responses:
        '200': {description: Deleted (standard code/message envelope)}
        '401': {description: Login required}
        '404': {description: Not found or belongs to another user}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Saved:
      description: Saved
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer}
              message: {type: string}
              data: {$ref: '#/components/schemas/Schedule'}
  schemas:
    ScheduleInput:
      type: object
      required: [title, date, allDay]
      properties:
        title: {type: string, minLength: 1, maxLength: 100}
        date: {type: string, format: date, description: '2000-01-01 through 2100-12-31'}
        allDay: {type: boolean}
        time: {type: string, nullable: true, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Required for timed items; normalized to null for all-day items'}
        location: {type: string, maxLength: 200, default: ''}
        notes: {type: string, maxLength: 2000, default: ''}
    Schedule:
      allOf:
        - {$ref: '#/components/schemas/ScheduleInput'}
        - type: object
          required: [id]
          properties:
            id: {type: integer, format: int64}
