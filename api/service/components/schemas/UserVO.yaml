type: object
properties:
  talentProfileId: { type: integer }
  schoolName: { type: string }
  majorName: { type: string }
  id:
    type: integer
  nickname:
    type: string
  phone:
    type: string
  email:
    type: string
  school:
    $ref: ./SchoolVO.yaml
  major:
    $ref: ./MajorVO.yaml
  grade:
    type: integer
  oliveBranchCount:
    type: integer
    description: 付费橄榄枝余额
  freeBranchUsedToday:
    type: integer
    description: 今日已用免费次数(每日重置)
  lastActiveDate:
    type: string
    format: date
    description: 最后活跃日期(用于重置免费次数)
  authStatus:
    $ref: ./AuthStatus.yaml
  authImgUrl:
    type: string
    description: 学生证认证图
  avatarUrl:
    type: string
    description: 头像
  coverImage:
    type: string
    description: 封面图
  collaborationScore:
    type: number
    format: double
    description: 协作指数，0-100 分
  collaborationLevel:
    type: string
    description: 协作指数等级（较差/中等/良好/优秀/极好）
  createdAt:
    type: string
    format: date-time
  wechat:
    type: string
    description: 微信号
  skills:
    type: array
    items:
      type: string
    description: 技能标签（来自人才档案）
