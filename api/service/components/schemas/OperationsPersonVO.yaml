type: object
required:
  - name
  - schoolId
  - schoolName
  - position
properties:
  talentProfileId:
    type: integer
    nullable: true
    description: Present only when the person has an enabled public talent profile.
  avatarUrl:
    type: string
    nullable: true
    description: User avatar URL, present only when the person has an enabled public talent profile.
  name:
    type: string
  schoolId:
    type: integer
  schoolName:
    type: string
  studySchoolName:
    type: string
    nullable: true
    description: The linked user's school of study, independent of the operated school; null when unavailable.
  majorName:
    type: string
    nullable: true
    description: The linked user's major; null when unavailable.
  grade:
    type: integer
    nullable: true
    description: The linked user's entrance year, using the same format as talent profiles; null when unavailable.
  skills:
    type: array
    nullable: true
    items:
      type: string
    description: Personal tags from the enabled public talent profile; null when unavailable.
  position:
    type: string
    enum:
      - 运营负责人
      - 运营成员
