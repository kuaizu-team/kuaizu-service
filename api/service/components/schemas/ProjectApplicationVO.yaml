type: object
properties:
  id:
    type: integer
  projectId:
    type: integer
  projectName:
    type: string
  reviewerId:
    type: integer
  reviewerRole:
    type: string
  reviewerRoleName:
    type: string
  assignedRole:
    type: string
  assignedRoleName:
    type: string
  canReview:
    type: boolean
    description: 当前登录用户是否可对该申请执行同意入队/不合适操作
  isCurrentMember:
    type: boolean
    description: 申请人当前是否仍在该项目团队中；仅已加入团队状态下有展示意义
  applicant:
    $ref: ./UserVO.yaml
  applyReason:
    type: string
    deprecated: true
    description: 申请理由/留言(已弃用)
  status:
    $ref: ./ApplicationStatus.yaml
  replyMsg:
    type: string
    deprecated: true
    description: 队长回复(已弃用)
  appliedAt:
    type: string
    format: date-time
  isRead:
    type: boolean
    description: 项目方是否已读(仅待审核状态有意义)
  talentProfile:
    $ref: ./TalentProfileVO.yaml

