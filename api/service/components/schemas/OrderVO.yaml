type: object
properties:
  id:
    type: integer
  productId:
    type: integer
    description: 商品ID
  productName:
    type: string
    description: 商品名称
  templateCode:
    type: string
    nullable: true
    description: SMS template code for this order
  templateName:
    type: string
    nullable: true
    description: SMS template display name for this order
  refundStatus:
    type: integer
    description: Refund status, 0=none, 1=pending, 2=success, 3=rejected, 4=withdrawn
  refundReason:
    type: string
    nullable: true
    description: Refund application reason
  refundApplyTime:
    type: string
    format: date-time
    nullable: true
    description: Refund application time
  rejectReason:
    type: string
    nullable: true
    description: Refund reject reason
  rejectTime:
    type: string
    format: date-time
    nullable: true
    description: Refund reject time
  refundWithdrawTime:
    type: string
    format: date-time
    nullable: true
    description: Refund withdraw time
  actualPaid:
    type: number
    format: double
    description: 实付金额
  status:
    $ref: ./OrderStatus.yaml
  pushStatus:
    type: string
    nullable: true
    enum: [pending, success, failed]
    description: Paid message delivery status
  pushRetryCount:
    type: integer
    description: Number of manual delivery retries
  lastPushTime:
    type: string
    format: date-time
    nullable: true
    description: Last delivery attempt time
  pushErrorMessage:
    type: string
    nullable: true
    description: Last delivery failure reason
  wxPayNo:
    type: string
    description: 微信支付单号
  payTime:
    type: string
    format: date-time
    description: 支付时间
  createdAt:
    type: string
    format: date-time
