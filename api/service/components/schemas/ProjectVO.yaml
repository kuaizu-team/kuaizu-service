type: object
properties:
  creator:
    $ref: ./UserVO.yaml
  events:
    type: array
    items:
      $ref: ./EventVO.yaml
  tags:
    type: array
    items:
      $ref: ./ProjectTagVO.yaml
  publisherRole: { type: string }
  publisherRoleName: { type: string }
  initiatingSchoolId:
    type: integer
    description: Same school ID as schoolId.
  initiatingSchoolName: { type: string }
  interaction:
    $ref: ./InteractionVO.yaml
  interactionUnreadCount:
    type: integer
    minimum: 0
  currentUserRole:
    type: string
    description: Current user's role in this project, when the current user is creator or member.
  currentUserRoleName:
    type: string
    description: Display name for currentUserRole.
  canCompleteRecruitment:
    type: boolean
    description: Whether the current user is in the highest permission role group and can complete recruitment.
  canDeleteMembers:
    type: boolean
    description: Whether the current user is in the highest permission role group and can delete project members.
  id:
    type: integer
  name:
    type: string
  description:
    type: string
  rejectReason:
    type: string
    nullable: true
  deletedAt:
    type: string
    format: date-time
    nullable: true
  schoolId:
    type: integer
    description: Project school ID.
  schoolName:
    type: string
  direction:
    $ref: ./Direction.yaml
  memberCount:
    type: integer
  status:
    $ref: ./ProjectStatus.yaml
  promotionStatus:
    type: integer
    description: 推广状态:0-无,1-推广中,2-已结束
  isCrossSchool:
    type: integer
    description: |
      是否跨校: 1-可以,0-不可以
  viewCount:
    type: integer
  pendingApplicationCount:
    type: integer
    description: 待处理申请数量（status=0 的申请记录数），无申请时为 0
  createdAt:
    type: string
    format: date-time
    description: Project creation time (ISO 8601).
  updatedAt:
    type: string
    format: date-time
    description: 项目最后更新时间（ISO 8601），列表按此字段降序排列
  recruitCompletedAt:
    type: string
    format: date-time
    description: Recruit completed timestamp.
  endedAt:
    type: string
    format: date-time
    description: Project ended timestamp.
