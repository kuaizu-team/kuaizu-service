type: object
properties:
  creator:
    $ref: ./UserVO.yaml
  tags:
    type: array
    items:
      $ref: ./ProjectTagVO.yaml
  publisherRole: { type: string }
  publisherRoleName: { type: string }
  initiatingSchoolId: { type: integer }
  initiatingSchoolName: { type: string }
  interaction:
    $ref: ./InteractionVO.yaml
  id:
    type: integer
  name:
    type: string
  description:
    type: string
  schoolId:
    type: integer
  schoolName:
    type: string
  direction:
    $ref: ./Direction.yaml
  memberCount:
    type: integer
  status:
    $ref: ./ProjectStatus.yaml
  promotionStatus:
    type: integer
    description: 推广状态:0-无,1-推广中,2-已结束
  isCrossSchool:
    type: integer
    description: |
      是否跨校: 1-可以,0-不可以
  viewCount:
    type: integer
  pendingApplicationCount:
    type: integer
    description: 待处理申请数量（status=0 的申请记录数），无申请时为 0
  updatedAt:
    type: string
    format: date-time
    description: 项目最后更新时间（ISO 8601），列表按此字段降序排列
