type: object
properties:
  id:
    type: integer
  name:
    type: string
  isRanking:
    type: boolean
  registrationDeadline:
    type: string
    format: date
    nullable: true
  isOpen:
    type: boolean
    description: Whether registration is open. The deadline date remains open through the end of that day.
  isExpired:
    type: boolean
    description: Whether registration has expired. Events without a deadline are not expired.
  articleUrl:
    type: string
    nullable: true
  level:
    type: string
    enum: [national, regional, school]
    nullable: true
  summary:
    type: string
    nullable: true
  schoolName:
    type: string
    nullable: true
  displayOrder:
    type: integer
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
