type: object
properties:
  id:
    type: integer
  name:
    type: string
  isRanking:
    type: boolean
  registrationDeadline:
    type: string
    format: date
    nullable: true
  isOpen:
    type: boolean
    description: Whether registration is open. The deadline date remains open through the end of that day.
  isExpired:
    type: boolean
    description: Whether registration has expired. Events without a deadline are not expired.
  articleUrl:
    type: string
    nullable: true
  level:
    type: string
    enum: [national, regional, school]
    nullable: true
  summary:
    type: string
    nullable: true
  organizerName:
    type: string
    nullable: true
  description:
    type: string
    nullable: true
  resourceUrl:
    type: string
    nullable: true
  qqGroup:
    type: string
    nullable: true
  allowCrossSchool:
    type: boolean
  allowCrossMajor:
    type: boolean
  crossSchoolMajorRule:
    type: string
    enum: [allow_cross_school_and_major, allow_cross_major, reject_cross_major]
    nullable: true
  participationMode:
    type: string
    enum: [individual, team]
    nullable: true
  teamMinMembers:
    type: integer
    minimum: 1
    nullable: true
  teamMaxMembers:
    type: integer
    minimum: 1
    nullable: true
  viewCount:
    type: integer
    format: int64
  schoolName:
    type: string
    nullable: true
  displayOrder:
    type: integer
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
