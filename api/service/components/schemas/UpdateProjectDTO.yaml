type: object
properties:
  tags:
    type: array
    minItems: 1
    maxItems: 5
    items: { type: string, maxLength: 12 }
  publisherRole: { type: string }
  schoolId:
    type: integer
    description: Project school ID; synchronized with initiatingSchoolId when provided.
  initiatingSchoolId: { type: integer }
  milestones:
    type: array
    items:
      $ref: ./ProjectMilestoneDTO.yaml
  members:
    type: array
    items:
      $ref: ./ProjectMemberDTO.yaml
  name:
    type: string
    maxLength: 200
  description:
    type: string
  direction:
    $ref: ./Direction.yaml
  memberCount:
    type: integer
    minimum: 1
  isCrossSchool:
    type: integer
    description: |
      是否跨校: 1-可以,0-不可以
  educationRequirement:
    type: integer
    description: 学历要求1-大专2-本科
  skillRequirement:
    type: string
    description: 技能要求
  needReview:
    type: boolean
    description: |
      是否将项目状态重置为"待审核（0）"。
      前端在用户实际修改了内容时传 true，未做任何修改直接保存时不传或传 false。
