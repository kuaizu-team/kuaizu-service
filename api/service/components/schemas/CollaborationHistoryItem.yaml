type: object
required:
  - id
  - projectId
  - projectName
  - score
  - type
  - raterName
properties:
  id:
    type: integer
    format: int64
  projectId:
    type: integer
  projectName:
    type: string
  score:
    type: number
    format: double
    minimum: 0
    maximum: 100
  type:
    type: string
    enum:
      - project
      - initial
  raterName:
    type: string
  createdAt:
    type: string
    format: date-time