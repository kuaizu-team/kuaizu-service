allOf:
  - $ref: ./ProjectVO.yaml
  - type: object
    properties:
      defaultTimelineHidden:
        type: boolean
        description: Whether the derived project-created timeline node is hidden; createdAt is preserved.
      creator:
        $ref: ./UserVO.yaml
      milestones:
        type: array
        items:
          $ref: ./ProjectMilestoneVO.yaml
      images:
        type: array
        maxItems: 6
        items: { type: string }
      imageKeys:
        type: array
        maxItems: 6
        items: { type: string }
      members:
        type: array
        items:
          $ref: ./ProjectMemberVO.yaml
      viewCount:
        type: integer
        description: 浏览量
      applicationCount:
        type: integer
        nullable: true
        description: 当前保存的项目投递记录总量，包含全部处理状态，不包含橄榄枝
      educationRequirement:
        type: integer
        description: 学历要求1-大专2-本科
      skillRequirement:
        type: string
        description: 技能要求
      promotionExpireTime:
        type: string
        format: date-time
        description: 推广结束时间
      createdAt:
        type: string
        format: date-time
