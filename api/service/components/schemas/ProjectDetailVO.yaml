allOf:
  - $ref: ./ProjectVO.yaml
  - type: object
    properties:
      creator:
        $ref: ./UserVO.yaml
      milestones:
        type: array
        items:
          $ref: ./ProjectMilestoneVO.yaml
      images:
        type: array
        maxItems: 6
        items: { type: string }
      imageKeys:
        type: array
        maxItems: 6
        items: { type: string }
      members:
        type: array
        items:
          $ref: ./ProjectMemberVO.yaml
      viewCount:
        type: integer
        description: 浏览量
      applicationCount:
        type: integer
        description: 申请数量
      educationRequirement:
        type: integer
        description: 学历要求1-大专2-本科
      skillRequirement:
        type: string
        description: 技能要求
      promotionExpireTime:
        type: string
        format: date-time
        description: 推广结束时间
      createdAt:
        type: string
        format: date-time
