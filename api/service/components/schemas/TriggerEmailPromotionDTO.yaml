type: object
required:
  - orderId
  - projectId
properties:
  orderId:
    type: integer
    description: Paid email-promotion order ID
  projectId:
    type: integer
    description: Project ID to promote
  strategy:
    type: string
    enum: [region, project, major]
    default: region
    description: Optional recipient selection strategy. Defaults to region for backward compatibility.
  maxRecipients:
    type: integer
    description: Optional; when present it must equal the paid order quantity. The final count uses order quantity.
