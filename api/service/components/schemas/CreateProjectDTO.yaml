type: object
required:
  - name
  - description
  - memberCount
  - isCrossSchool
properties:
  tags:
    type: array
    maxItems: 5
    items: { type: string, maxLength: 12 }
  publisherRole: { type: string }
  initiatingSchoolId: { type: integer }
  milestones:
    type: array
    items:
      $ref: ./ProjectMilestoneDTO.yaml
  members:
    type: array
    items:
      $ref: ./ProjectMemberDTO.yaml
  name:
    type: string
    maxLength: 200
  description:
    type: string
  schoolId:
    type: integer
    description: Project school ID; defaults to the current user's school and is synchronized with initiatingSchoolId.
  direction:
    $ref: ./Direction.yaml
  memberCount:
    type: integer
    minimum: 1
  isCrossSchool:
    type: integer
    description: |
      是否跨校: 1-可以,0-不可以
  educationRequirement:
    type: integer
    description: 学历要求1-大专2-本科
  skillRequirement:
    type: string
    description: 技能要求
