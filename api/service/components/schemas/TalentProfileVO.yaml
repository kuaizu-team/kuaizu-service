type: object
properties:
  interaction:
    $ref: ./InteractionVO.yaml
  id:
    type: integer
  userId:
    type: integer
  nickname:
    type: string
  schoolName:
    type: string
  majorName:
    type: string
  skills:
    type: array
    items:
      type: string
  mbti:
    type: string
  authStatus:
    type: integer
    description: 认证状态 0-未认证 1-已认证 2-认证失败
  collaborationScore:
    type: number
    format: double
    description: 协作指数，0-100 分
  collaborationLevel:
    type: string
    description: 协作指数等级（较差/中等/良好/优秀/极好）
  status:
    $ref: ./TalentStatus.yaml
  rejectReason:
    type: string
    description: 驳回/下架原因
  avatarUrl:
    type: string
    description: 头像URL
  grade:
    type: integer
    description: 入学年份（如 2022）
