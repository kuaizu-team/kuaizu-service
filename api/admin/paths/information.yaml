get:
  tags:
    - Information
  summary: List information content
  description: Super admin only. Supports pagination and optional category filter.
  parameters:
    - in: query
      name: category
      schema:
        type: string
        enum:
          - campus_event
          - campus_project
          - kuaizu_talking
          - developer_weekly
    - in: query
      name: page
      schema:
        type: integer
        default: 1
    - in: query
      name: size
      schema:
        type: integer
        default: 10
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/InformationContentPagedData.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
post:
  tags:
    - Information
  summary: Create information content
  description: Super admin only.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/InformationContentDTO.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/AdminInformationContent.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
