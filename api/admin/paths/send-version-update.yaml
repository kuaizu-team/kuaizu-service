post:
  tags:
    - Roadmap
  summary: Start version update subscription broadcast
  description: Super admin only. Starts an asynchronous broadcast task.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SendVersionUpdateDTO.yaml
  responses:
    '200':
      description: Broadcast started
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/VersionUpdateBroadcastResult.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
