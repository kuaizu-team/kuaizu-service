      "security": [
        {
          "bearerAuth": []
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "code": {
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "data": {
                    "type": "object",
                    "properties": {
                      "list": {
                        "type": "array",
                        "items": {
                          "$ref": "../../common/campus_cooperation.yaml#/schemas/CommercialOrder"
                        }
                      },
                      "total": {
                        "type": "integer",
                        "format": "int64"
                      },
                      "page": {
                        "type": "integer",
                        "format": "int64"
                      },
                      "size": {
                        "type": "integer",
                        "format": "int64"
                      }
                    },
                    "required": [
                      "list",
                      "total",
                      "page",
                      "size"
                    ]
                  }
                },
                "required": [
                  "code",
                  "message",
                  "data"
                ]
              }
            }
          }
        },
        "400": {
          "description": "Invalid input or business state"
        },
        "401": {
          "description": "Authentication required"
        },
        "403": {
          "description": "Role/account forbidden"
        },
        "404": {
          "description": "Resource absent or outside the current school scope"
        }
      },
      "parameters": [
        {
          "name": "page",
          "in": "query",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000000,
            "default": 1
          }
        },
        {
          "name": "size",
          "in": "query",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "default": 20
          },
          "description": "Capped at 50."
        },
        {
          "name": "status",
          "in": "query",
          "schema": {
            "type": "string",
            "enum": [
              "available",
              "closed"
            ]
