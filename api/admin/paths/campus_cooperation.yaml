      "description": "No request body. Platform super admins, current school owners and bound school administrators can export accessible cooperation applications. Starts a background run (20 minute timeout), returning current status. Only one cooperation export runs per process; an existing running target is not launched again. Confirmed permission/rate-limit creation rejections produce failed and allow retry after correction; uncertain remote creation or mapping persistence failures require reconciliation. No application review or notification is performed.",
      "security": [
        {
          "bearerAuth": []
        }
      ],
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      ],
      "responses": {
        "200": {
          "description": "Current synchronization target",
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "code": {
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "data": {
                    "$ref": "../../common/campus_cooperation.yaml#/schemas/CooperationFeishuSync"
                  }
                },
                "required": [
                  "code",
                  "message",
                  "data"
                ]
              }
            }
          }
        },
        "400": {
