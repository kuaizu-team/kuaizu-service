delete:
  tags:
    - Projects
  summary: 永久删除超过七天的删除中项目
  operationId: permanentlyDeleteProject
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: 永久删除成功
    '400':
      description: 项目不存在或尚未满足永久删除条件
    '403':
      description: 仅超级管理员或有该赛事项目权限的赛事管理员可操作
