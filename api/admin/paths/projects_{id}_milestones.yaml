post:
  tags: [Projects]
  summary: 新增项目时间节点（仅超级管理员）
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [milestoneDate, description]
          properties:
            milestoneDate: { type: string, format: date }
            description: { type: string }
  responses:
    '200': { description: 新增成功 }
    '403': { description: 权限不足 }
