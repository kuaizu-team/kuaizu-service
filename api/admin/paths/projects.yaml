get:
  tags:
    - Projects
  summary: 获取项目列表（支持分页和筛选）
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
      description: 页码
    - in: query
      name: size
      schema:
        type: integer
        default: 20
      description: 每页条数
    - in: query
      name: status
      schema:
        type: integer
      description: 项目状态筛选
    - in: query
      name: keyword
      schema:
        type: string
      description: 关键词筛选（name/description）
    - in: query
      name: eventId
      schema:
        type: integer
        minimum: 1
      description: 按关联赛事筛选项目；校区角色仍受本校数据范围约束
    - in: query
      name: sortBy
      schema:
        type: string
        enum: [pendingCount, updatedAt, id]
      description: Sort field for admin project list
    - in: query
      name: order
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction
  responses:
    '200':
      description: 成功获取项目列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/ProjectPagedData.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
