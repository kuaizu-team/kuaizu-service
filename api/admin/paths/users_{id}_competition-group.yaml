put:
  tags:
    - Users
  summary: 更新用户比赛交流群状态
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              nullable: true
              enum:
                - entered
                - rejected
              description: 比赛交流群状态
            note:
              type: string
              nullable: true
              description: 比赛交流群备注
  responses:
    '200':
      description: 更新成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BaseResponse.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml