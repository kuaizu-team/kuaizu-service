post:
  tags:
    - Events
  summary: 向上合并赛事
  operationId: mergeAdminEvent
  description: 仅平台超级管理员可用。将学校级赛事合并至区域级或国家级赛事，或将区域级赛事合并至国家级赛事。
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - targetEventId
          properties:
            targetEventId:
              type: integer
  responses:
    '200':
      description: 合并成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/BaseResponse.yaml
              - type: object
                properties:
                  data:
                    $ref: ../components/schemas/AdminEvent.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
