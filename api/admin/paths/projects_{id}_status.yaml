patch:
  tags: [Projects]
  summary: 标记项目完成招募或已结束（仅超级管理员）
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [status]
          properties:
            status: { type: integer, enum: [3, 5] }
  responses:
    '200': { description: 更新成功 }
    '403': { description: 权限不足 }
