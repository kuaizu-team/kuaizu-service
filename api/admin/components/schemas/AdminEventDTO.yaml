type: object
required:
  - name
properties:
  name:
    type: string
  isRanking:
    type: boolean
  registrationDeadline:
    type: string
    format: date
    nullable: true
  articleUrl:
    type: string
    nullable: true
  displayOrder:
    type: integer
    default: 0
  createdAt:
    type: string
    format: date-time
    nullable: true
  level:
    type: string
    enum: [national, regional, school]
    nullable: true
  summary:
    type: string
    nullable: true
  organizerName:
    type: string
    nullable: true
    maxLength: 200
  description:
    type: string
    nullable: true
    maxLength: 10000
  resourceUrl:
    type: string
    nullable: true
    maxLength: 2048
  qqGroup:
    type: string
    nullable: true
    maxLength: 32
  allowCrossSchool:
    type: boolean
    default: true
  allowCrossMajor:
    type: boolean
    default: true
  schoolId:
    type: integer
    nullable: true
  managerAccount:
    type: string
    nullable: true
  managerPassword:
    type: string
    format: password
    minLength: 6
    nullable: true
  managerPhone:
    type: string
    pattern: '^1\d{10}$'
    nullable: true
