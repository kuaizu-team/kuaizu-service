type: object
required:
  - activity
  - smsSendCounts
  - invitation
  - ratings
properties:
  activity:
    type: object
    required:
      - projectsTotal
      - projectsPending
      - projectsApproved
      - projectsCompleted
      - projectsEnded
      - applicationsTotal
      - applicationsPending
      - applicationsPassed
      - applicationsRejected
      - oliveBranchesTotal
      - oliveBranchesPending
      - oliveBranchesReadPending
      - ordersTotal
      - paidAmount
    properties:
      projectsTotal: { type: integer }
      projectsPending: { type: integer }
      projectsApproved: { type: integer }
      projectsCompleted: { type: integer }
      projectsEnded: { type: integer }
      applicationsTotal: { type: integer }
      applicationsPending: { type: integer }
      applicationsPassed: { type: integer }
      applicationsRejected: { type: integer }
      oliveBranchesTotal: { type: integer }
      oliveBranchesPending: { type: integer }
      oliveBranchesReadPending: { type: integer }
      ordersTotal: { type: integer }
      paidAmount: { type: integer, format: int64, description: Paid amount in cents }
  smsSendCounts:
    type: object
    required: [URGE_PROCESS, INVITE_SUPER_ADMIN]
    properties:
      URGE_PROCESS: { type: integer, format: int64 }
      INVITE_SUPER_ADMIN: { type: integer, format: int64 }
  invitation:
    type: object
    required: [status, intention_text, conversation_status]
    properties:
      status:
        type: string
        enum: [pending, interested, not_interested]
      intention_text: { type: string, nullable: true }
      conversation_status:
        type: string
        enum: [in_progress, accepted, rejected]
        nullable: true
      updated_at: { type: string, format: date-time, nullable: true }
  ratings:
    type: object
    required: [list, total, page, size, totalPages]
    properties:
      list:
        type: array
        items:
          type: object
          required:
            - id
            - projectId
            - projectName
            - raterId
            - targetId
            - targetMemberId
            - raterRole
            - raterWeight
            - score
            - createdAt
            - isEffective
          properties:
            id: { type: integer, format: int64 }
            projectId: { type: integer }
            projectName: { type: string }
            raterId: { type: integer }
            raterNickname: { type: string, nullable: true }
            targetId: { type: integer }
            targetMemberId: { type: integer, format: int64 }
            raterRole: { type: string }
            raterWeight: { type: number, format: double }
            score: { type: integer }
            createdAt: { type: string, format: date-time }
            isEffective: { type: boolean }
            projectScore: { type: number, format: double, nullable: true }
      total: { type: integer, format: int64 }
      page: { type: integer }
      size: { type: integer }
      totalPages: { type: integer }
