type: object
required:
  - id
  - name
  - isRanking
  - displayOrder
  - projectCount
  - createdAt
  - updatedAt
properties:
  id:
    type: integer
  name:
    type: string
  isRanking:
    type: boolean
  registrationDeadline:
    type: string
    format: date-time
    nullable: true
  articleUrl:
    type: string
    nullable: true
  level:
    type: string
    enum: [national, regional, school]
    nullable: true
  summary:
    type: string
    nullable: true
  organizerName:
    type: string
    nullable: true
  description:
    type: string
    nullable: true
  officialWebsite:
    type: string
    nullable: true
    maxLength: 2048
    description: HTTP or HTTPS official event website.
  resourceUrl:
    type: string
    nullable: true
  qqGroup:
    type: string
    nullable: true
  allowCrossSchool:
    type: boolean
  allowCrossMajor:
    type: boolean
  viewCount:
    type: integer
    format: int64
  schoolId:
    type: integer
    nullable: true
  schoolName:
    type: string
    nullable: true
  adminId:
    type: integer
    nullable: true
  managerAccount:
    type: string
    nullable: true
  managerNickname:
    type: string
    nullable: true
  displayOrder:
    type: integer
  projectCount:
    type: integer
    description: Number of distinct related projects visible within the current administrator's school scope.
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time

  crossSchoolMajorRule:
    type: string
    nullable: true
    enum: [allow_cross_school_and_major, allow_cross_major, reject_cross_major]
  participationMode:
    type: string
    nullable: true
    enum: [individual, team, both]
  participationNote:
    type: string
    nullable: true
    maxLength: 10000
  teamMinMembers:
    type: integer
    nullable: true
    minimum: 1
  teamMaxMembers:
    type: integer
    nullable: true
    minimum: 1
