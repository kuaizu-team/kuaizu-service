type: object
required: [id, eventId, title, nodeTime, sortOrder]
properties:
  id: { type: integer, format: int64 }
  eventId: { type: integer }
  title: { type: string }
  nodeTime: { type: string, format: date-time, nullable: true }
  timeText: { type: string, nullable: true, maxLength: 500, description: 原文时间说明；仅说明时不代表确定日期 }
  description: { type: string, nullable: true }
  sortOrder: { type: integer }
  createdAt: { type: string, format: date-time }
  updatedAt: { type: string, format: date-time }
