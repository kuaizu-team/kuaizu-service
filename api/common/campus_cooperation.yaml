{
  "schemas": {
    "CooperationLink": {
      "type": "object",
      "properties": {
        "title": {
          "type": "string"
        },
        "url": {
          "type": "string",
          "description": "Every link must have a non-empty HTTP/HTTPS URL without embedded credentials, including approval-only links."
        },
        "public": {
          "type": "boolean",
          "description": "True: visible without application approval. False: visible after approval when applicationRequired=true. Required on content updates; legacy stored links inherit linksVisible when absent."
        }
      },
      "required": [
        "title",
        "url"
      ]
    },
    "CooperationContact": {
      "type": "object",
      "properties": {
        "type": {
          "type": "string",
          "enum": [
            "qq_group",
            "wechat",
            "qq",
            "email"
          ]
        },
        "label": {
          "type": "string"
        },
        "value": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "type",
        "value"
      ]
    },
    "CommercialOrderInput": {
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 100
        },
        "companyName": {
          "type": "string",
          "minLength": 1,
          "maxLength": 100
        },
        "description": {
          "type": "string",
          "nullable": true
        },
        "status": {
          "type": "string",
          "enum": [
            "available",
            "closed",
            "ended"
          ],
          "default": "available",
          "description": "available permits new claims; closed stops new claims only; ended withdraws all school publications and cannot be reopened."
        },
        "feishuWikiNodeToken": {
          "type": "string",
          "nullable": true,
          "description": "Bound Wiki node token. Input also accepts an HTTPS feishu.cn /wiki/ URL. Omit or null to preserve the existing binding on update; an empty string clears it. Binding changes are rejected while a Base exists or synchronization is running/needs attention."
        },
        "template": {
          "allOf": [
            {
              "$ref": "#/schemas/CooperationTemplate"
            }
          ],
          "description": "Omit to preserve the existing template on update; null clears it. School editors explicitly copy the template into a draft."
        },
        "schoolId": {
          "type": "integer",
          "description": "Required for school-owner creation; must be a currently owned school. Automatically creates its local cooperation draft."
        }
      },
      "required": [
        "name",
        "companyName"
      ]
    },
    "CommercialOrder": {
      "type": "object",
      "properties": {
        "id": {
          "type": "integer",
          "format": "int64"
        },
        "name": {
          "type": "string"
        },
        "companyName": {
          "type": "string"
        },
        "description": {
          "type": "string",
          "nullable": true
        },
        "status": {
          "type": "string",
          "enum": [
            "available",
            "closed",
            "ended"
          ],
          "description": "available permits new claims; closed stops new claims only; ended withdraws all school publications and cannot be reopened."
        },
        "createdBy": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "updatedBy": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "createdAt": {
          "type": "string",
          "format": "date-time"
        },
        "updatedAt": {
          "type": "string",
          "format": "date-time"
        },
        "feishuWikiNodeToken": {
          "type": "string",
          "nullable": true,
          "maxLength": 128,
          "description": "Bound commercial order Wiki document node token."
        },
        "template": {
          "$ref": "#/schemas/CooperationTemplate"
        },
        "claimedSchoolIds": {
          "type": "array",
          "nullable": true,
          "items": {
            "type": "integer",
            "minimum": 1
          },
          "description": "Claimed schools within the current administrator ownership scope; null when that scope is empty (including platform super admins)."
        },
        "originSchoolId": {
          "type": "integer",
          "nullable": true
        },
        "originSchoolName": {
          "type": "string",
          "nullable": true
        },
        "promotionStatus": {
          "type": "string",
          "description": "local: source school only; submitted: source owner consent recorded, platform may promote; national: all school owners may claim. Existing platform orders are national."
        },
        "claimCount": {
          "type": "integer"
        }
      },
      "required": [
        "id",
        "name",
        "companyName",
        "status",
        "feishuWikiNodeToken",
        "template",
        "claimedSchoolIds"
      ]
    },
    "CooperationContentInput": {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "minLength": 1,
          "maxLength": 20
        },
        "introduction": {
          "type": "string",
          "minLength": 1
        },
        "linksVisible": {
          "type": "boolean",
          "default": false,
          "deprecated": true,
          "description": "Legacy fallback for stored links without public. Use links[].public for per-link visibility."
        },
        "links": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/CooperationLink"
          },
          "description": "Every submitted link requires title, a valid URL, and an explicit public boolean; old editors must refresh before saving."
        },
        "imagesVisible": {
          "type": "boolean",
          "default": false
        },
        "imageTitle": {
          "type": "string",
          "nullable": true,
          "maxLength": 100
        },
        "images": {
          "type": "array",
          "items": {
            "type": "string",
            "pattern": "^campus-cooperation-images/"
          }
        },
        "contactsVisible": {
          "type": "boolean",
          "default": true
        },
        "contacts": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/CooperationContact"
          }
        },
        "applicationRequired": {
          "type": "boolean",
          "default": false
        },
        "published": {
          "type": "boolean",
          "default": false
        },
        "tags": {
          "type": "array",
          "uniqueItems": true,
          "description": "Ordered names from the shared project_tag library. New names are inserted atomically when saving cooperation content. Omit to preserve existing tags; send an empty array to clear.",
          "maxItems": 5,
          "items": {
            "type": "string",
            "maxLength": 12,
            "minLength": 1
          }
        }
      },
      "required": [
        "title",
        "introduction"
      ]
    },
    "CampusCooperation": {
      "type": "object",
      "properties": {
        "id": {
          "type": "integer",
          "format": "int64"
        },
        "commercialOrderId": {
          "type": "integer",
          "format": "int64"
        },
        "schoolId": {
          "type": "integer",
          "format": "int64"
        },
        "claimedBy": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "claimedAt": {
          "type": "string",
          "format": "date-time"
        },
        "orderName": {
          "type": "string"
        },
        "orderDescription": {
          "type": "string",
          "nullable": true,
          "description": "Commercial order details available from the scoped claimed row."
        },
        "orderOriginSchoolId": {
          "type": "integer",
          "nullable": true
        },
        "orderPromotionStatus": {
          "type": "string",
          "description": "Source order promotion state: local, submitted or national. Used to manage school-created orders from the existing claim list."
        },
        "companyName": {
          "type": "string"
        },
        "schoolName": {
          "type": "string"
        },
        "updatedBy": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "updatedAt": {
          "type": "string",
          "format": "date-time"
        },
        "title": {
          "type": "string",
          "nullable": true,
          "maxLength": 20
        },
        "introduction": {
          "type": "string",
          "nullable": true
        },
        "linksVisible": {
          "type": "boolean",
          "default": false,
          "deprecated": true,
          "description": "Legacy fallback for stored links without public. Use links[].public for per-link visibility."
        },
        "links": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/CooperationLink"
          }
        },
        "imagesVisible": {
          "type": "boolean",
          "default": false
        },
        "imageTitle": {
          "type": "string",
          "nullable": true,
          "maxLength": 100
        },
        "images": {
          "type": "array",
          "items": {
            "type": "string",
            "pattern": "^campus-cooperation-images/"
          }
        },
        "contactsVisible": {
          "type": "boolean",
          "default": true
        },
        "contacts": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/CooperationContact"
          }
        },
        "applicationRequired": {
          "type": "boolean",
          "default": false
        },
        "published": {
          "type": "boolean",
          "default": false
        },
        "imageUrls": {
          "type": "array",
          "items": {
            "type": "string"
          },
          "description": "Resolved preview URLs in the same order as images; saving still uses registered object keys."
        },
        "tags": {
          "type": "array",
          "uniqueItems": true,
          "description": "Ordered tag names from the shared project_tag library.",
          "maxItems": 5,
          "items": {
            "type": "string",
            "maxLength": 12,
            "minLength": 1
          }
        },
        "viewCount": {
          "description": "Number of distinct authenticated users who successfully accessed this school-scoped cooperation detail. Repeated views do not increment it.",
          "type": "integer",
          "minimum": 0,
          "format": "int64"
        },
        "orderStatus": {
          "type": "string",
          "enum": [
            "available",
            "closed",
            "ended"
          ]
        },
        "orderTemplate": {
          "$ref": "#/schemas/CooperationTemplate"
        },
        "feishuWikiNodeToken": {
          "type": "string",
          "nullable": true,
          "maxLength": 128
        }
      },
      "required": [
        "id",
        "commercialOrderId",
        "schoolId",
        "companyName",
        "schoolName",
        "published",
        "tags",
        "viewCount",
        "orderStatus",
        "orderTemplate",
        "feishuWikiNodeToken"
      ]
    },
    "CooperationPublicView": {
      "type": "object",
      "properties": {
        "id": {
          "type": "integer",
          "format": "int64"
        },
        "orderName": {
          "type": "string"
        },
        "companyName": {
          "type": "string"
        },
        "schoolName": {
          "type": "string"
        },
        "title": {
          "type": "string",
          "nullable": true,
          "maxLength": 20
        },
        "introduction": {
          "type": "string",
          "nullable": true
        },
        "linksVisible": {
          "type": "boolean",
          "default": false,
          "description": "True when the filtered links array contains at least one link visible to the current user. Retained for client compatibility."
        },
        "links": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/CooperationLink"
          },
          "description": "Only links accessible to the current user; approval-only titles and URLs are omitted until approval."
        },
        "imagesVisible": {
          "type": "boolean",
          "default": false
        },
        "imageTitle": {
          "type": "string",
          "nullable": true
        },
        "images": {
          "type": "array",
          "items": {
            "type": "string",
            "description": "Resolved image URL."
          }
        },
        "contactsVisible": {
          "type": "boolean",
          "default": false
        },
        "contacts": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/CooperationContact"
          }
        },
        "applicationRequired": {
          "type": "boolean",
          "default": false
        },
        "applicationStatus": {
          "type": "string",
          "enum": [
            "",
            "pending",
            "approved",
            "rejected"
          ]
        },
        "canApply": {
          "type": "boolean",
          "default": false
        },
        "tags": {
          "type": "array",
          "uniqueItems": true,
          "description": "Ordered tag names from the shared project_tag library.",
          "maxItems": 5,
          "items": {
            "type": "string",
            "maxLength": 12,
            "minLength": 1
          }
        },
        "viewCount": {
          "description": "Number of distinct authenticated users who successfully accessed this school-scoped cooperation detail. Repeated views do not increment it.",
          "type": "integer",
          "minimum": 0,
          "format": "int64"
        }
      },
      "required": [
        "id",
        "orderName",
        "companyName",
        "schoolName",
        "title",
        "introduction",
        "links",
        "images",
        "contactsVisible",
        "applicationRequired",
        "applicationStatus",
        "canApply",
        "tags",
        "viewCount"
      ],
      "description": "In application mode the server filters links per public flag and current user approval, and omits contacts until approval. Normal mode returns all links. Contact and image visibility switches are unchanged. Internal admin IDs and card snapshots are never included."
    },
    "CooperationApplication": {
      "type": "object",
      "properties": {
        "id": {
          "type": "integer",
          "format": "int64"
        },
        "cooperationId": {
          "type": "integer",
          "format": "int64"
        },
        "userId": {
          "type": "integer",
          "format": "int64"
        },
        "attemptNo": {
          "type": "integer",
          "format": "int64",
          "minimum": 1
        },
        "status": {
          "type": "string",
          "enum": [
            "pending",
            "approved",
            "rejected"
          ]
        },
        "appliedAt": {
          "type": "string",
          "format": "date-time"
        },
        "reviewedBy": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "reviewedAt": {
          "type": "string",
          "nullable": true,
          "format": "date-time"
        },
        "reviewRemark": {
          "type": "string",
          "nullable": true,
          "maxLength": 500
        },
        "profileSnapshot": {
          "type": "object",
          "additionalProperties": true,
          "description": "Only present in the school-authorized admin review response. Whitelisted server-generated card snapshot; never credentials/OpenID."
        },
        "cooperationTitle": {
          "type": "string",
          "nullable": true
        },
        "companyName": {
          "type": "string"
        },
        "schoolName": {
          "type": "string"
        }
      },
      "required": [
        "id",
        "cooperationId",
        "userId",
        "attemptNo",
        "status",
        "appliedAt"
      ]
    },
    "CooperationPendingNotification": {
      "type": "object",
      "properties": {
        "id": {
          "type": "integer",
          "format": "int64"
        },
        "type": {
          "type": "string",
          "enum": [
            "application-accepted",
            "application-rejected",
            "olive-accepted",
            "olive-rejected",
            "member-removed",
            "cooperation-approved",
            "cooperation-rejected"
          ]
        },
        "priority": {
          "type": "integer",
          "format": "int64"
        },
        "messageId": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "createdAt": {
          "type": "string",
          "format": "date-time"
        },
        "projectId": {
          "type": "integer",
          "format": "int64"
        },
        "projectName": {
          "type": "string"
        },
        "appliedAt": {
          "type": "string",
          "format": "date-time"
        },
        "discussingAt": {
          "type": "string",
          "nullable": true,
          "format": "date-time"
        },
        "rejectedAt": {
          "type": "string",
          "nullable": true,
          "format": "date-time"
        },
        "joinedAt": {
          "type": "string",
          "nullable": true,
          "format": "date-time"
        },
        "reviewerRoleName": {
          "type": "string",
          "nullable": true
        },
        "assignedRoleName": {
          "type": "string",
          "nullable": true
        },
        "operatorName": {
          "type": "string",
          "nullable": true
        },
        "removedAt": {
          "type": "string",
          "nullable": true,
          "format": "date-time"
        },
        "cooperationId": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "cooperationApplicationId": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "cooperationTitle": {
          "type": "string",
          "nullable": true
        },
        "companyName": {
          "type": "string",
          "nullable": true
        },
        "schoolName": {
          "type": "string",
          "nullable": true
        },
        "applicationStatus": {
          "type": "string",
          "nullable": true,
          "enum": [
            "pending",
            "approved",
            "rejected"
          ]
        },
        "reviewedAt": {
          "type": "string",
          "nullable": true,
          "format": "date-time"
        },
        "applicationId": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "oliveBranchId": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        },
        "memberRemovalId": {
          "type": "integer",
          "format": "int64",
          "nullable": true
        }
      },
      "required": [
        "id",
        "type",
        "priority"
      ]
    },
    "CooperationTemplate": {
      "type": "object",
      "nullable": true,
      "description": "Optional school draft template. Title and introduction are validated like cooperation content. Publication and image visibility must be false, imageTitle must be null/omitted and images empty/omitted. No automatic publication or copying occurs.",
      "properties": {
        "title": {
          "type": "string",
          "minLength": 1,
          "maxLength": 20
        },
        "introduction": {
          "type": "string",
          "minLength": 1
        },
        "tags": {
          "type": "array",
          "uniqueItems": true,
          "description": "Ordered tag names copied into the school draft. Saving a template alone does not insert names into the shared tag library.",
          "maxItems": 5,
          "items": {
            "type": "string",
            "maxLength": 12,
            "minLength": 1
          }
        },
        "linksVisible": {
          "type": "boolean",
          "default": false,
          "deprecated": true,
          "description": "Legacy fallback for stored links without public. Use links[].public for per-link visibility."
        },
        "links": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/CooperationLink"
          },
          "description": "Every submitted link requires title, a valid URL, and an explicit public boolean; old editors must refresh before saving."
        },
        "contactsVisible": {
          "type": "boolean",
          "default": true
        },
        "contacts": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/CooperationContact"
          }
        },
        "applicationRequired": {
          "type": "boolean",
          "default": false
        }
      },
      "required": [
        "title",
        "introduction"
      ]
    },
    "CooperationFeishuSync": {
      "type": "object",
      "description": "School-authorized cooperation export status. Remote app/table tokens and record mappings are never returned.",
      "properties": {
        "cooperationId": {
          "type": "integer",
          "format": "int64",
          "minimum": 1
        },
        "status": {
          "type": "string",
          "enum": [
            "idle",
            "running",
            "succeeded",
            "failed",
            "needs_attention"
          ]
        },
        "message": {
          "type": "string"
        },
        "syncedAt": {
          "type": "string",
          "format": "date-time",
          "nullable": true
        },
        "updatedAt": {
          "type": "string",
          "format": "date-time",
          "description": "Last persisted target update; idle without a target returns the Go zero timestamp."
        },
        "wikiUrl": {
          "type": "string",
          "format": "uri",
          "description": "Present when the order has a bound Wiki document."
        },
        "baseUrl": {
          "type": "string",
          "format": "uri",
          "description": "Present when a remote school Base is mapped."
        },
        "retryable": {
          "type": "boolean",
          "description": "Only present as true for needs_attention when all unresolved record creates can be safely replayed. failed is retryable after correcting the cause; running cannot start a second run."
        }
      },
      "required": [
        "cooperationId",
        "status",
        "message",
        "syncedAt",
        "updatedAt"
      ]
    },
    "CommercialOrderAction": {
      "type": "object",
      "required": [
        "action"
      ],
      "properties": {
        "action": {
          "type": "string",
          "enum": [
            "submit",
            "withdraw",
            "promote"
          ],
          "description": "submit/withdraw: current source-school owner only; promote: platform only after submitted consent. Proposal edits invalidate pending consent; national promotion is irreversible."
        }
      }
    }
  }
}
